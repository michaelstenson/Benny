<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Benny — Sign in</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <meta name="theme-color" content="#17151f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Benny" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/theme.css" />
</head>
<body class="hl-page min-h-screen flex items-center justify-center p-6">
  <main class="hl-card max-w-sm w-full p-8">
    <div class="flex items-center gap-3 mb-6">
      <div class="hl-logo">
        <svg width="20" height="24" viewBox="0 0 100 122" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M76 46C90 52 94 66 90 78C82 74 72 66 68 56L76 46Z" fill="#F4ECD8"/>
          <path d="M50 8C66 8 76 26 76 46V96C76 110 64 118 50 118C36 118 24 110 24 96V46C24 26 34 8 50 8Z" fill="#F4ECD8"/>
          <path d="M50 30C58 30 62 42 62 54V100C62 108 57 112 50 112C43 112 38 108 38 100V54C38 42 42 30 50 30Z" fill="#211F2B"/>
          <path d="M67 13L98 23L67 33Z" fill="#F2C879"/>
          <circle cx="59" cy="18" r="3.4" fill="#211F2B"/>
          <ellipse cx="40" cy="118" rx="7" ry="4" fill="#F4ECD8"/>
          <ellipse cx="60" cy="118" rx="7" ry="4" fill="#F4ECD8"/>
        </svg>
      </div>
      <div>
        <h1 class="hl-h1">Sign in</h1>
        <p class="hl-subtitle">Penguin Palace members only</p>
      </div>
    </div>

    <form id="email-form" class="flex flex-col gap-3">
      <input id="email-input" type="email" required placeholder="you@example.com"
        class="hl-input" autocomplete="email" />
      <button type="submit" class="hl-button">Email me a sign-in code</button>
    </form>

    <form id="code-form" class="flex flex-col gap-3 hidden">
      <p class="hl-subtitle">Check your email. Type the code here, or tap the link in the email.</p>
      <input id="code-input" type="text" inputmode="numeric" autocomplete="one-time-code"
        placeholder="Sign-in code" class="hl-input" maxlength="10" />
      <button type="submit" class="hl-button">Sign in</button>
      <button type="button" id="restart" class="hl-back text-left">← use a different email</button>
    </form>

    <p id="login-status" class="text-xs hl-muted mt-4 min-h-4"></p>
  </main>

  <script src="/login.js"></script>
</body>
</html>
