<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Benny — Timeline</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <meta name="theme-color" content="#17151f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Benny" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/theme.css" />
</head>
<body class="hl-page min-h-screen flex items-center justify-center p-6">
  <main class="hl-card max-w-2xl w-full p-4 sm:p-8">
    <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
      <div class="flex items-center gap-3">
        <div class="hl-logo">
          <svg width="20" height="24" viewBox="0 0 100 122" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M76 46C90 52 94 66 90 78C82 74 72 66 68 56L76 46Z" fill="#F4ECD8"/>
            <path d="M50 8C66 8 76 26 76 46V96C76 110 64 118 50 118C36 118 24 110 24 96V46C24 26 34 8 50 8Z" fill="#F4ECD8"/>
            <path d="M50 30C58 30 62 42 62 54V100C62 108 57 112 50 112C43 112 38 108 38 100V54C38 42 42 30 50 30Z" fill="#211F2B"/>
            <path d="M67 13L98 23L67 33Z" fill="#F2C879"/>
            <circle cx="59" cy="18" r="3.4" fill="#211F2B"/>
            <ellipse cx="40" cy="118" rx="7" ry="4" fill="#F4ECD8"/>
            <ellipse cx="60" cy="118" rx="7" ry="4" fill="#F4ECD8"/>
          </svg>
        </div>
        <h1 class="hl-h1">Timeline</h1>
      </div>
      <a href="/" class="hl-back">← home</a>
    </div>

    <div class="flex items-center justify-between flex-wrap gap-3 mb-6">
      <div class="hl-view-toggle">
        <button type="button" data-view="timeline" class="hl-view-toggle-btn active">Timeline</button>
        <button type="button" data-view="month" class="hl-view-toggle-btn">Month</button>
      </div>
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-1.5">
          <span class="hl-dot" style="background:#34D399;box-shadow:0 0 6px #34D399;"></span>
          <span class="text-xs hl-muted">Michael</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="hl-dot" style="background:#A78BFA;box-shadow:0 0 6px #A78BFA;"></span>
          <span class="text-xs hl-muted">Mer</span>
        </div>
      </div>
    </div>

    <div id="error" class="hidden mb-4 text-sm hl-error"></div>

    <!-- Timeline view: chores due + timed events only, chronological -->
    <div id="timeline-view">
      <p id="timeline-loading" class="hl-muted text-sm">Loading...</p>
      <ul id="timeline-list" class="hidden hl-divide"></ul>
      <p id="timeline-empty" class="hidden hl-muted text-sm">Nothing coming up in the next 60 days.</p>
    </div>

    <!-- Month view: rolling 6-week grid, all-day titles + timed-event dots -->
    <div id="month-view" class="hidden">
      <p id="month-loading" class="hl-muted text-sm">Loading...</p>
      <div id="month-content" class="hidden">
        <div class="hl-month-weekdays">
          <div class="hl-month-weekday">Sun</div>
          <div class="hl-month-weekday">Mon</div>
          <div class="hl-month-weekday">Tue</div>
          <div class="hl-month-weekday">Wed</div>
          <div class="hl-month-weekday">Thu</div>
          <div class="hl-month-weekday">Fri</div>
          <div class="hl-month-weekday">Sat</div>
        </div>
        <div id="month-grid" class="hl-month-grid"></div>
      </div>
    </div>
  </main>

  <script src="/timeline.js"></script>
</body>
</html>
