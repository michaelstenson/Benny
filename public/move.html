<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Benny — Netherlands move</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <meta name="theme-color" content="#17151f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Benny" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/theme.css" />
  <script src="/auth-guard.js"></script>
</head>
<body class="hl-page hl-move min-h-screen flex justify-center p-4 sm:p-6">
  <main class="hl-card max-w-2xl w-full p-5 sm:p-8">
    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-3">
        <div class="hl-logo">
          <svg width="20" height="24" viewBox="0 0 100 122" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M76 46C90 52 94 66 90 78C82 74 72 66 68 56L76 46Z" fill="#F4ECD8"/>
            <path d="M50 8C66 8 76 26 76 46V96C76 110 64 118 50 118C36 118 24 110 24 96V46C24 26 34 8 50 8Z" fill="#F4ECD8"/>
            <path d="M50 30C58 30 62 42 62 54V100C62 108 57 112 50 112C43 112 38 108 38 100V54C38 42 42 30 50 30Z" fill="#211F2B"/>
            <path d="M67 13L98 23L67 33Z" fill="#F2C879"/>
            <circle cx="59" cy="18" r="3.4" fill="#211F2B"/>
            <ellipse cx="40" cy="118" rx="7" ry="4" fill="#F4ECD8"/>
            <ellipse cx="60" cy="118" rx="7" ry="4" fill="#F4ECD8"/>
          </svg>
        </div>
        <h1 class="hl-h1" id="project-name">Netherlands move</h1>
      </div>
      <a href="/" class="hl-back">← home</a>
    </div>

    <p id="load-status" class="hl-muted text-sm">Loading the plan...</p>

    <div id="plan" class="hidden">
      <!-- Key dates: the countdown. Tap one to move it (and its pinned tasks). -->
      <div id="key-dates" class="flex flex-wrap gap-2"></div>
      <div id="key-date-editor" class="hl-inset mt-3 hidden"></div>

      <!-- F-08: the why. -->
      <div id="why" class="mt-6"></div>

      <div class="flex items-center justify-between flex-wrap gap-3 mt-8">
        <nav class="hl-view-toggle" id="person-toggle">
          <button type="button" class="hl-view-toggle-btn" data-person="all">Everyone</button>
          <button type="button" class="hl-view-toggle-btn" data-person="michael">Michael</button>
          <button type="button" class="hl-view-toggle-btn" data-person="mer">Mer</button>
        </nav>
        <a href="/log.html" class="hl-back">Decision log →</a>
      </div>

      <!-- The Penguin Summit agenda. -->
      <section class="hl-inset mt-4">
        <p class="hl-label">Penguin Summit · Sundays at 7pm</p>
        <p class="text-xs hl-muted mt-1 mb-2">Star up to three tasks as this week's focus.</p>
        <div id="agenda"></div>
      </section>

      <section class="mt-10">
        <p class="hl-label mb-3">Decisions</p>
        <div id="decisions" class="hl-stack"></div>
      </section>

      <section class="mt-10">
        <p class="hl-label mb-3">Every task, by workstream</p>
        <div id="workstreams" class="hl-stack"></div>
      </section>
    </div>
  </main>

  <script src="/escape.js"></script>
  <script src="/move-shared.js"></script>
  <script src="/move.js"></script>
</body>
</html>
