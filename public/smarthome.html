<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Benny — Smart Home</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/theme.css" />
</head>
<body class="hl-page min-h-screen flex items-center justify-center p-6">
  <main class="hl-card max-w-xl w-full p-8">
    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-3">
        <div class="hl-logo">
          <svg width="20" height="24" viewBox="0 0 100 122" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M76 46C90 52 94 66 90 78C82 74 72 66 68 56L76 46Z" fill="#F4ECD8"/>
            <path d="M50 8C66 8 76 26 76 46V96C76 110 64 118 50 118C36 118 24 110 24 96V46C24 26 34 8 50 8Z" fill="#F4ECD8"/>
            <path d="M50 30C58 30 62 42 62 54V100C62 108 57 112 50 112C43 112 38 108 38 100V54C38 42 42 30 50 30Z" fill="#211F2B"/>
            <path d="M67 13L98 23L67 33Z" fill="#F2C879"/>
            <circle cx="59" cy="18" r="3.4" fill="#211F2B"/>
            <ellipse cx="40" cy="118" rx="7" ry="4" fill="#F4ECD8"/>
            <ellipse cx="60" cy="118" rx="7" ry="4" fill="#F4ECD8"/>
          </svg>
        </div>
        <h1 class="hl-h1">Smart Home</h1>
      </div>
      <a href="/" class="hl-back">← home</a>
    </div>

    <div id="error" class="hidden mb-4 text-sm hl-error"></div>

    <!-- Shown only until the thermostat is connected -->
    <div id="connect-row" class="hidden flex-col gap-2 mb-6"></div>

    <p id="loading" class="hl-muted text-sm">Loading...</p>

    <!-- Shown once we have thermostat data -->
    <ul id="thermostats" class="hidden hl-divide"></ul>

    <h2 class="hl-label mt-8 mb-2">Shades</h2>
    <ul id="shades" class="hidden hl-divide"></ul>
    <p id="shades-empty" class="hidden hl-muted text-sm">
      No shades reported yet — the Raspberry Pi bridge isn't running, or
      hasn't polled successfully yet. See README "Stage 8" for setup.
    </p>
  </main>

  <script src="/smarthome.js"></script>
</body>
</html>
