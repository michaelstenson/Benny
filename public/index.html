<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Benny — Penguin Palace</title>
  <!-- Tailwind via CDN: zero build step, good enough until the app
       outgrows it (that's when we'd introduce a bundler like Vite). -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center">
  <main class="max-w-md w-full mx-4 bg-white rounded-2xl shadow-md p-8 text-center">
    <div class="text-5xl mb-4">🐧</div>
    <h1 class="text-2xl font-semibold text-slate-800">Benny</h1>
    <p class="text-slate-500 mt-1">Penguin Palace's assistant, hello-world edition.</p>

    <div id="status" class="mt-6 text-sm text-slate-400">Checking in with the backend...</div>

    <div class="mt-6 flex flex-col gap-2">
      <a href="/calendar.html" class="text-sm text-slate-500 hover:text-slate-700 underline">
        Go to Calendar →
      </a>
      <a href="/chores.html" class="text-sm text-slate-500 hover:text-slate-700 underline">
        Go to Chores →
      </a>
      <a href="/bills.html" class="text-sm text-slate-500 hover:text-slate-700 underline">
        Go to Bills →
      </a>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
