<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Benny — Calendar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-6">
  <main class="max-w-lg w-full bg-white rounded-2xl shadow-md p-8">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-semibold text-slate-800">🐧 Calendar</h1>
      <a href="/" class="text-sm text-slate-400 hover:text-slate-600">← home</a>
    </div>

    <div id="error" class="hidden mb-4 text-sm text-red-600 bg-red-50 rounded-lg p-3"></div>

    <!-- Whoever hasn't connected their own calendar yet gets a button here.
         Both can show at once; each is independent of the other. -->
    <div id="connect-row" class="hidden flex-col gap-2 mb-6"></div>

    <p id="loading" class="text-slate-400 text-sm">Loading...</p>

    <!-- Shown once we have events (or know there are none) -->
    <ul id="events" class="hidden divide-y divide-slate-100"></ul>
  </main>

  <script src="/calendar.js"></script>
</body>
</html>
