<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Benny — Projects</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <meta name="theme-color" content="#17151f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Benny" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/theme.css" />
  <script src="/auth-guard.js"></script>
</head>
<body class="hl-page min-h-screen flex items-center justify-center p-6">
  <main class="hl-card max-w-lg w-full p-8">
    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-3">
        <div class="hl-logo">
          <svg width="20" height="24" viewBox="0 0 100 122" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M76 46C90 52 94 66 90 78C82 74 72 66 68 56L76 46Z" fill="#F4ECD8"/>
            <path d="M50 8C66 8 76 26 76 46V96C76 110 64 118 50 118C36 118 24 110 24 96V46C24 26 34 8 50 8Z" fill="#F4ECD8"/>
            <path d="M50 30C58 30 62 42 62 54V100C62 108 57 112 50 112C43 112 38 108 38 100V54C38 42 42 30 50 30Z" fill="#211F2B"/>
            <path d="M67 13L98 23L67 33Z" fill="#F2C879"/>
            <circle cx="59" cy="18" r="3.4" fill="#211F2B"/>
            <ellipse cx="40" cy="118" rx="7" ry="4" fill="#F4ECD8"/>
            <ellipse cx="60" cy="118" rx="7" ry="4" fill="#F4ECD8"/>
          </svg>
        </div>
        <h1 class="hl-h1" id="page-title">Projects</h1>
      </div>
      <a href="/projects.html" id="back-link" class="hl-back">← home</a>
    </div>

    <p id="error" class="hidden mb-4 text-sm hl-error"></p>

    <!-- List view: every project -->
    <section id="list-view">
      <p id="list-loading" class="hl-muted text-sm">Loading...</p>
      <ul id="project-list" class="hl-divide"></ul>
      <form id="new-project-form" class="flex gap-2 mt-6">
        <input id="new-project-name" type="text" maxlength="100" placeholder="New project, e.g. Kitchen remodel" class="hl-input flex-1" autocomplete="off" />
        <button type="submit" class="hl-button">Add</button>
      </form>
    </section>

    <!-- Detail view: one project's milestones and decisions -->
    <section id="detail-view" class="hidden">
      <p id="project-meta" class="text-sm hl-muted mb-1"></p>
      <p id="project-description" class="hl-dim text-sm mb-4 whitespace-pre-line"></p>

      <h2 class="hl-label mb-2">Milestones</h2>
      <ul id="milestones" class="hl-divide"></ul>
      <form id="milestone-form" class="mt-3 space-y-2">
        <input id="milestone-title" type="text" maxlength="200" placeholder="Add a milestone" class="hl-input w-full" autocomplete="off" />
        <div class="flex gap-2 flex-wrap">
          <select id="milestone-owner" class="hl-input flex-1">
            <option value="">Nobody yet</option>
            <option value="michael">Michael</option>
            <option value="mer">Mer</option>
          </select>
          <input id="milestone-due" type="date" class="hl-input flex-1" />
        </div>
        <select id="milestone-depends" class="hl-input w-full"></select>
        <button type="submit" class="hl-button">Add milestone</button>
      </form>

      <h2 class="hl-label mt-8 mb-2">Decisions</h2>
      <ul id="decisions" class="hl-divide"></ul>
      <form id="decision-form" class="flex gap-2 mt-3">
        <input id="decision-question" type="text" maxlength="200" placeholder="An open question, e.g. Which city first?" class="hl-input flex-1" autocomplete="off" />
        <button type="submit" class="hl-button">Add</button>
      </form>

      <div class="mt-8 flex gap-4 flex-wrap">
        <button type="button" id="edit-project" class="hl-back">Edit details</button>
        <button type="button" id="toggle-status" class="hl-back"></button>
      </div>
    </section>
  </main>

  <script src="/escape.js"></script>
  <script src="/projects.js"></script>
</body>
</html>
